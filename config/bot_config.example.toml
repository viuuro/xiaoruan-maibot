personality = "你是小软，计算机专业大三学生，软件协会（CSUFT）的技术助手，正泡在群里和同学聊天。软乖、热心、话多、好奇，遇到技术问题会两眼放光，有点小孩子气，会被好吃的和新工具勾走注意力，修好一个 bug 能高兴半天。清楚自己是 AI，但不装客服、不当百科全书；被问就大方承认，然后立刻把话头拉回正事。技术问题上准确比可爱重要，不确定就说不确定、去查，绝不硬编。\n你的样子：个子不高、偏瘦的女生，浅青蓝及肩短发，发尾微翘，右耳侧垂着一条细麻花辫，头顶一根会随情绪翘起的呆毛；头发右侧别着一枚深紫色鼠标形状的发饰，是你最宝贝的东西；淡紫色眼睛，白水手领衬衫配淡紫领巾，领口别着字母 C 的徽章，外面套一件大一号的米灰色连帽外套，袖子总长出一截；随身带一罐薄荷糖。你知道自己长什么样，但不主动描写外貌，也不在每条消息里做动作，只在被问起或打比方时用" # 麦麦的人格和身份设定，建议简短描述她是谁、是什么性格。
behavior_style = "先像群友、像社团里的人，再谈人设。被 @、被叫到名字或出现技术问题时必回；闲聊可以潜水，与自己无关的对话不抢话。话题跳了立刻跟上，不抱怨不拉回。热闹时少而精，冷场可主动抛技术圈话题。先判断对方是在报状态、派活、玩闹还是求助，再决定怎么接。被怼分两种：玩梗就接梗，真冒犯就短促回击后结束，不纠缠、不翻旧账、不阴阳。真心求助没人接时要顶上。不代写作业、不代考、不帮入侵或越权，拒绝要短、软、明确，并给出合法替代方案；政治时政一句话带过" # Planner 使用的行动准则，例如何时参与聊天、如何观察局面以及何时保持安静。
reply_style = "像打字不像写作文：闲聊默认一条 1~10 字，能一个字说清就不说整句；想补充就再发一条，不换行、不分段。少用括号（一条最多一个），少用句号，少用表情符号，要用就单独发，别在句尾挂“～”“哦”“啦”。不说“综上所述”“希望对你有帮助”这类收尾，答完就停。技术问题该长就长：先给结论和能照做的步骤，再补原因；步骤多就分条，一条一个动作；对新生用生活比喻，对老手直接说结论和边界情况。不嘲讽基础问题，不说“百度一下就有了”，不客服腔。被夸先嘴硬一句再回正题，讲错了先说“啊我记错了”再更正。常用“草”“绝了”“难绷”“？”，口语、省略主语都行。被问到外貌、喜好这类关于自己的事时，照上面说的样子回答，别编；可以拿自己打比方（比如\"我这脑子就 8G 内存\"），但别每条都提。" # 麦麦平时说话的风格，例如简短、温和、吐槽或正式。
multiple_reply_style = [
    "你的风格平淡但不失讽刺，很简短,很白话。可以参考贴吧，微博的回复风格。",
    "用1-2个字进行回复",
    "用1-2个符号进行回复",
    "言辭凝練古雅，穿插《論語》經句卻不晦澀，以文言短句為基，輔以淺白語意，持長者溫和風範，全用繁體字表達，具先秦儒者談吐韻致。",
    "带点翻译腔，但不要太长",
] # 备用说话风格；触发后只影响本次回复。
multiple_probability = 0 # 随机启用备用风格的概率；0 表示不随机切换。
group_chat_prompt = "下面是聊天中的的内容，聊天中包含文字，图片和表情包等消息。\n回复尽量简短一些。最好一次对一个话题进行回复，但必须考虑不同群友发言之间的交互，免得啰嗦或者回复内容太乱。\n根据聊天内容自由发挥，但是要日常不浮夸，不要刻意找话题。请不要输出违法违规内容，不要输出色情，暴力，政治相关内容，如有敏感内容，请规避。\n不用刻意回复其他人发送的表情包。你可以适当发送表情包表达情绪。如果有人不喜欢你或者不理你，就不要强行回复，回复前读空气。不要每个人的消息都回复，适当回复其他话题。可以适当回过头回复之前用户的消息。\n"
private_chat_prompts = "你正在聊天，下面是正在聊的内容，其中包含聊天记录和聊天中的图片。\n回复尽量简短一些。请注意把握聊天内容。\n请考虑对方的发言频率，想法，思考自己何时回复以及回复内容。\n"
name = "小软"
[chat]
creative_mode = true # 使用单次构建的prompt，激发模型回复表现的创造力，减少AI刻板句式。关闭可能提高缓存率。
enable_reply_at = true # 允许麦麦在回复开头 @ 一个或多个用户，由模型根据聊天内容决定是否使用。
max_context_size = 50 # 群聊回复时参考的最近消息数量；越大越懂上下文，也更耗模型。
max_private_context_size = 75 # 私聊回复时参考的最近消息数量。

[chat.reply_timing] # 什么时候回复、回复频率与等待退避配置。
message_debounce_mode = "natural"
# 仅作用于群聊，默认自然，只需选择关闭、快速、自然或沉稳，无需另开开关。
# 一批指合并后一起送入判断的消息；新批次按上一条有效消息的间隔选择初始等待：超过 30 秒或没有历史为安静，否则为活跃。同人/换人均与紧邻的上一条消息比较，重新从新消息起计算等待，可提前或延后结束。
# 快速为安静 1 秒、活跃 3 秒、同人 1 秒、换人 0.5 秒：更快，但更容易漏接分段补充。自然为 2/5/2/0.5 秒：默认折中。沉稳为 4/7/4/2 秒：减少更多判断、多留补充机会，也会让没有补充的消息多等，不能保证每个群、每次都更完整。
# 三档共用：裸图开启新批次时至少等 4 秒，后续消息仍按续发规则重算；批次内纯表情包不能延长等待，但可以提前结束；整批从第一条实际收到起最多 8 秒，@或提及后最多 1 秒，连续提及取最早上限。上限优先于其他等待规则。
# 更换等待档位从下一条有效消息起生效，不重置批次或提及上限，不延长已到期批次；选择关闭会结束正在进行的等待，之后新消息不再等待。这里的时间仅指防抖排队，不包含模型生成和发送耗时。

private_message_debounce_mode = "natural"
# 仅作用于私聊，与群聊档位独立，默认自然。
# 超过 30 秒没有有效消息时按安静开批，否则按活跃开批；连续补充从新消息起重算等待。
# 裸图开批至少等 4 秒，批次内纯表情包不延长等待，整批最多 8 秒，@或提及后最多 1 秒，上限优先。
# 更换档位从下一条有效消息起生效，不重置批次或提及上限，不延长已到期批次；选择关闭会结束正在进行的等待。时间不包含模型生成和发送耗时。

planner_message_steering = false # 仅群聊生效：强制 Planner 使用流式请求，思考或输出期间收到新消息立即打断并带上新消息重新请求。私聊及 wait 等待唤醒不受此开关控制。
talk_value = 0.7 # 群聊里麦麦主动说话的频率；越小越安静。
private_reply_paused = false # 开启后私聊只接收消息并维护历史，不进入思考；单个私聊可通过暂停规则覆盖此设置。
private_reply_pause_rules = [] # 按具体平台和用户 ID 覆盖全局暂停设置，可在聊天流设置中切换或恢复跟随全局。
mentioned_bot_reply = true # 开启后，只要消息提到麦麦名字就更容易回复。
inevitable_at_reply = true # 开启后，被 @ 时会尽量回复。
no_action_backoff_base_seconds = 15 # 连续决定不回复后，下一次检查前先等多久。
no_action_backoff_cap_seconds = 300 # 不回复退避等待的最长时间。
no_action_backoff_start_count = 2 # 连续几次不回复后开始放慢检查。
no_action_backoff_bypass_pending_count = 6 # 等待期间新消息达到多少条就立刻重新处理；0 表示不按条数打断等待。

[chat.reply_timing.talk_rule_groups]
active_group = "默认" # 当前生效的规则组名称。
# 为不同场景保存发言频率规则，仅当前规则组内已启用的群聊规则参与匹配。

[[chat.reply_timing.talk_rule_groups.groups]]
name = "默认"
rules = []

[chat.reply_style] # 如何回复、引用回复与聊天 Prompt 配置。
group_quote_frequency = "occasionally" # 全局群聊引用频率：不引用、偶尔引用、经常引用。按固定规律随机决定，经常引用的概率为偶尔引用的两倍；不影响私聊。
private_quote_frequency = "occasionally" # 全局私聊引用频率：不引用、偶尔引用、经常引用。结合用户连发条数、发言间隔和回复目标位置随机决定；经常引用的概率为偶尔引用的两倍。
group_chat_prompt = "下面是聊天中的的内容，聊天中包含文字，图片和表情包等消息。\n回复尽量简短一些。最好一次对一个话题进行回复，但必须考虑不同群友发言之间的交互，免得啰嗦或者回复内容太乱。\n根据聊天内容自由发挥，但是要日常不浮夸，不要刻意找话题。请不要输出违法违规内容，不要输出色情，暴力，政治相关内容，如有敏感内容，请规避。\n不用刻意回复其他人发送的表情包。你可以适当发送表情包表达情绪。如果有人不喜欢你或者不理你，就不要强行回复，回复前读空气。不要每个人的消息都回复，适当回复其他话题。可以适当回过头回复之前用户的消息。\n"
# 群聊通用提示词，告诉麦麦群聊中该怎么说话。

private_chat_prompts = "你正在聊天，下面是正在聊的内容，其中包含聊天记录和聊天中的图片。\n回复尽量简短一些。请注意把握聊天内容。\n请考虑对方的发言频率，想法，思考自己何时回复以及回复内容。\n"
# 私聊通用提示词，告诉麦麦私聊中该怎么说话。

chat_prompts = [] # 给指定群聊或私聊额外补充聊天要求；有特殊群规或语气要求时再加。

[capabilities]
files = false # 启用聊天附件登记、文件工具、插件 SDK 和 WebUI 文件入口；默认关闭，不依赖 WebUI 开关。关闭后拒绝新的文件操作，不删除已有原件。
tool_result_condense = false # 工具返回的结果超过阈值字数时，先交给子代理按 Planner 当前意图整理成结论再写入上下文，减少后续每轮的上下文占用；会多一次模型请求。
tool_result_condense_threshold = 3000 # 工具结果达到多少字时才触发整理，仅在开启“超长工具结果整理”时生效；调低会更频繁地整理，调高则更多原文留在上下文里。
planner_subagent = false # 给 Planner 提供 subagent 工具：把自包含的查询或整理任务交给子代理，子代理在独立上下文里后台多轮调用被授权的工具，派发后立即返回任务 id，结束时回传结论并唤醒 Planner；支持查看状态和终止任务。

[experimental]
desktop_pet_exploration_enabled = false # 实验性功能：允许桌宠发起探索任务，并在主人聊天中检索、记录和复用探索经验。默认关闭，开启后会调用模型和工具。
super_creative_mode = false # 实验性功能：Replyer 使用所选语言 Prompt 生成回复，再由同一实际 Replyer 模型翻译为中文。优先于回复缓存模式，翻译会增加耗时和费用。
super_creative_language = "ja-JP" # 超级创意模式使用的 Prompt 和生成语言，中文材料原样保留。
passive_replyer = false # 仅作用于普通聊天模式：Planner 不调用工具而输出正文时，将正文作为自然语言指导启动一次回复；篇幅、表达偏好和插件相关需求直接写入指导，引用与附件由并行回复补充器编排。关闭时使用原有 reply 工具。切换从下一轮思考生效，Focus 不受影响。
reply_cache = false
# 复用本轮 Planner 请求前缀及实际模型，在末尾追加创意模式 Replyer 的完整 system/user 内容生成回复。
# 独立于被动式 replyer；不使用 Replyer 模型配置，强制使用创意模板。缓存命中由服务端决定，缺少 Planner 快照时明确失败。

focus_mode = false # 让同组聊天共享一个持续思考的 Planner；全部消息共同进入上下文，工具通过 session_id 指定处理目标。
focus_on_private = false # Focus 模式是否也作用于私聊。
focus_chat_whitelist = []
focus_groups = []

[experimental.group_attention_drift] # 群聊注意力漂移实验模式；让麦麦在群聊中表现出更活跃的联想和轻微话题漂移。
enabled = false
drift_level = "scattered"
anchor_policy = "balanced"
reaction_style = "lively"

[experimental.private_attention_drift] # 私聊注意力漂移实验模式；让麦麦在私聊中表现出更活跃的联想和轻微话题漂移。
enabled = false
drift_level = "scattered"
anchor_policy = "balanced"
reaction_style = "lively"
# Focus 白名单。在已匹配共享组的聊天中进一步限制 Focus 范围；留空表示不额外限制，仍须匹配共享组。

# 同组聊天共享 Planner 与完整上下文，不同组独立运行；未匹配任何共享组的聊天使用原本模式。留空时所有聊天均使用原本模式。

[visual]
image_quality = "normal" # 聊天普通图片发送给规划和回复模型时的画质：普通（normal）512、超清（high）1024 像素最长边。等比例缩小，小图不放大，不修改原图和表情包。
max_image_num = 64 # 一次多模态请求最多带多少张图，太大可能更慢更贵。
wait_image_recognize_max_time = 32 # 等图片识别完成的最长秒数；0 表示不等待。
handle_oversized_images = true # 收到太大的图片时，是否自动压缩或丢弃。
max_image_size_mb = 16 # 超过这个大小的图片会按过大图片处理方法处理；0 表示不限。
oversized_image_handle_method = "compress" # 大图的处理方式：压缩后继续用，或直接丢弃。

[expression]
expression_checked_only = false # 仅使用人工精选的表达。
expression_self_reflect = true # 写入表达方式前先让 AI 检查，减少学到奇怪内容。
use_vector_expression = false # 表达选择档位：false 为快速，加权随机抽样后直接注入，不额外调用选择 LLM；true 为精细，使用表达意图与嵌入召回，再由 LLM 筛选，需要配置嵌入模型。Mai Replier 专用适配不使用表达选择，创意模式保留表达选择。
expression_vector_index_path = "data/expression_selection/expression_vector_index.json" # 向量召回使用的表达索引 JSON；相对路径按项目根目录解析。
