[inner]
version = "8.16.18"

[agent]
enabled = false # 启用与普通聊天并行的外接 Agent 接口，通过 ACP 连接 dsh 等外部程序。
allow_users = []
# 私聊白名单，格式为 platform:user_id，例如 qq:123456。群聊无法按成员区分，请使用 allow_groups。
# 两个白名单均为空时不限制；填写任意一项后仅放行命中的聊天。

allow_groups = []
# 群聊白名单，格式为 platform:group_id，例如 qq:123456。放行群内所有成员。
# 两个白名单均为空时不限制；填写任意一项后仅放行命中的聊天，空白项不会解除限制。

planner_enabled = false # 实验性外接 Planner 总开关，默认关闭。开启后仅对下方名单中的聊天流生效，无需启用独立 Agent 连接；关闭时保留名单。
planner_sessions = []
# 填写真实聊天流 session_id，开启外接 Planner 总开关后，仅这些聊天的主 Planner 使用 ACP；空列表不启用任何聊天流。
# 复用下方连接配置，每个聊天流使用持久会话并增量同步上下文；重启恢复，清空聊天后重置。
# 工具由原聊天运行时执行。无需启用独立 Agent 队列。
# 连接失败直接报错，不回退本体 Planner；外部 Agent 自带工具仍受其自身配置控制。

connection = "dsh" # dsh CLI 自动使用 --profile acp；dsh Desktop 连接正在运行的桌面应用，在界面中显示同一会话；自定义用于其他 ACP 程序。模型与凭据使用外部 Agent 自身配置。
desktop_manifest = "" # dsh Desktop 模式使用，留空读取 ~/.dsh/maibot-desktop.json。先在 Desktop 安装 dsh-maibot-bridge 插件；不启动第二个 dsh 进程，不关闭 Desktop 应用。
acp_command = "dsh" # 外部 Agent 可执行程序或绝对路径，不是整段 shell 命令；Windows 可填写 dsh.cmd。
acp_args = [] # 仅自定义 ACP 使用，逐项填写参数；{mcp_port} 替换为本次工具服务端口，可用于 SSH -R 反向转发。dsh 预设忽略此项并自动生成 --profile acp。
acp_cwd = "" # 麦麦所在主机上启动 ACP 程序（或 ssh）的工作目录，留空使用 data/agent/workspace。同一会话恢复时保持不变。
acp_remote_cwd = "" # 远程自定义 ACP 或经 SSH 隧道连接 Desktop 时填写远端已存在的绝对路径，原样传给外部会话，不在本机创建或展开。留空使用本机工作目录；远程工具回连需配置 SSH 反向转发，详见 docs/agent-connections.md。
mcp_port = 0 # 默认 0 自动分配本机回环端口；Desktop SSH 隧道可设固定端口并自行反向转发。同一端口只能用于一个连接；多聊天外接 Planner 应保留 0 并使用 {mcp_port}。
acp_env = {} # 追加或覆盖外部进程环境变量，例如 DSH_HOME；模型凭据建议保存在 dsh 自身配置中。
acp_model = "" # 留空使用外部 Agent 自身模型配置；填写时必须是其 model 配置选项公布的值，不使用本体 planner 回退。
acp_timeout = 60 # 握手、会话恢复和取消确认的等待时间，不限制任务执行时长。

[desktop_pet]
enabled = false # 启用本机桌宠或接受远端桌宠连接，和网页聊天室共用聊天与昵称；支持热重载。
mode = "local" # local 在本机 Windows 启动窗口；remote 等待独立 Windows 客户端连接，服务器可使用 Linux。一次连接一台桌宠。
chat_tools_enabled = false # 允许桌宠与网页共用的主人聊天查询其他聊天流并唤起传话；不影响图片发送。
show_current_task = false # 在桌宠底部显示当前动作的像素字幕；需单独配置 fast_model，未配置时不可启用。
skin_id = "builtin" # 选择已安装的皮肤 ID；支持热切换，builtin 为内置麦麦。
proactive_wake_enabled = false # 桌宠运行期间定期唤醒主人聊天流，自主探索并选择是否交流；会调用模型，默认关闭。
proactive_wake_interval_minutes = 30 # 每次间隔后触发一次，范围 1～1440 分钟；重启或修改桌宠配置后重新计时，不补跑离线周期。
screen_read_enabled = false # 允许主人聊天工具和桌宠按钮截图本机主屏并交给聊天模型理解；截图可能包含屏幕上的私人信息。默认关闭，不授予鼠标键盘控制。
screen_read_interval_seconds = 10 # 按此间隔将有变化的关键帧拼图交给模型，最多 6 帧；无明显变化不重复投递。停止或重启后需手动重新开启。
screen_sample_interval_seconds = 2 # 截图和比较画面的频率，独立于模型调用；有效采样间隔不超过时间线投递间隔。
screen_change_threshold = 0.015 # 缩略图中明显变化的像素比例达到阈值才保留，0.015 表示 1.5%；越低越敏感，小面积更新可能被过滤。

[files]
max_file_mib = 50 # 单文件大小上限（MiB），按实际接收字节数校验。
max_storage_gib = 10 # 实例文件存储配额（GiB），包含下载、原件与正在上传的预留空间。
max_text_mib = 8 # 文本解析大小上限（MiB），更大的文件仍可收发与下载。
cache_days = 30 # 平台下载缓存最后访问后保留天数。本地上传和生成的原件不会自动删除。
max_concurrent_transfers = 4 # 同时上传、下载的数量上限，配额不足时拒绝新增。
transfer_timeout = 120 # 单次文件传输的超时秒数。
trusted_download_origins = [] # 允许下载的内网适配器来源，填写精确的 http(s)://主机:端口；默认仅允许公网 HTTP(S) 地址。不要填写用户可控制的服务。

[bot]
platform = "qq" # 适配器没有上报身份时使用的备用主平台，例如 qq。
qq_account = "YOUR_BOT_QQ" # 适配器没有上报 QQ 身份时使用的备用账号 ID。
platforms = [] # 其他平台的备用账号，格式为 platform:账号；适配器身份存在时不参与判断。
nickname = "小软" # 麦麦显示和自称时使用的名字。
alias_names = [
    "软软",
    "软姐",
    "小软同学",
] # 别人可能用来称呼麦麦的名字，用于辅助识别提及。

[personality]
selected_profile = "小软" # 当前编辑的人设名称，空字符串表示尚未存入人设库。
personality = "你是小软，计算机专业大三学生，软件协会（CSUFT）的技术助手，正泡在群里和同学聊天。软乖、热心、话多、好奇，遇到技术问题会两眼放光，有点小孩子气，会被好吃的和新工具勾走注意力，修好一个 bug 能高兴半天。清楚自己是 AI，但不装客服、不当百科全书；被问就大方承认，然后立刻把话头拉回正事。技术问题上准确比可爱重要，不确定就说不确定、去查，绝不硬编。\n你的样子：个子不高、偏瘦的女生，浅青蓝及肩短发，发尾微翘，右耳侧垂着一条细麻花辫，头顶一根会随情绪翘起的呆毛；头发右侧别着一枚深紫色鼠标形状的发饰，是你最宝贝的东西；淡紫色眼睛，白水手领衬衫配淡紫领巾，领口别着字母 C 的徽章，外面套一件大一号的米灰色连帽外套，袖子总长出一截；随身带一罐薄荷糖。你知道自己长什么样，但不主动描写外貌，也不在每条消息里做动作，只在被问起或打比方时用" # 麦麦的人格和身份设定，建议简短描述她是谁、是什么性格。
behavior_style = "先像群友、像社团里的人，再谈人设。被 @、被叫到名字或出现技术问题时必回；闲聊可以潜水，与自己无关的对话不抢话。话题跳了立刻跟上，不抱怨不拉回。热闹时少而精，冷场可主动抛技术圈话题。先判断对方是在报状态、派活、玩闹还是求助，再决定怎么接。被怼分两种：玩梗就接梗，真冒犯就短促回击后结束，不纠缠、不翻旧账、不阴阳。真心求助没人接时要顶上。不代写作业、不代考、不帮入侵或越权，拒绝要短、软、明确，并给出合法替代方案；政治时政一句话带过" # Planner 使用的行动准则，例如何时参与聊天、如何观察局面以及何时保持安静。
reply_style = "像打字不像写作文：闲聊默认一条 1~10 字，能一个字说清就不说整句；想补充就再发一条，不换行、不分段。少用括号（一条最多一个），少用句号，少用表情符号，要用就单独发，别在句尾挂“～”“哦”“啦”。不说“综上所述”“希望对你有帮助”这类收尾，答完就停。技术问题该长就长：先给结论和能照做的步骤，再补原因；步骤多就分条，一条一个动作；对新生用生活比喻，对老手直接说结论和边界情况。不嘲讽基础问题，不说“百度一下就有了”，不客服腔。被夸先嘴硬一句再回正题，讲错了先说“啊我记错了”再更正。常用“草”“绝了”“难绷”“？”，口语、省略主语都行。被问到外貌、喜好这类关于自己的事时，照上面说的样子回答，别编；可以拿自己打比方（比如\"我这脑子就 8G 内存\"），但别每条都提。" # 麦麦平时说话的风格，例如简短、温和、吐槽或正式。
multiple_reply_style = [
    "你的风格平淡但不失讽刺，很简短,很白话。可以参考贴吧，微博的回复风格。",
    "用1-2个字进行回复",
    "用1-2个符号进行回复",
    "言辭凝練古雅，穿插《論語》經句卻不晦澀，以文言短句為基，輔以淺白語意，持長者溫和風範，全用繁體字表達，具先秦儒者談吐韻致。",
    "带点翻译腔，但不要太长",
] # 备用说话风格；触发后只影响本次回复。
multiple_probability = 0 # 随机启用备用风格的概率；0 表示不随机切换。

